services:
  app:
    build: .
    container_name: vertexphp_app
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./app:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Framework Base}
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-framework}
      DB_USER: ${DB_USER:-framework}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    networks:
      - default
    depends_on:
      - db

  # Servicio para MySQL
  db:
    image: mysql:8.0
    container_name: vertexphp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-framework}
      MYSQL_USER: ${DB_USER:-framework}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - vertexphp_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - default
 

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vertexphp_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:  
      - default    
    depends_on:
      - db    

# Redes
networks:
  default:
    driver: bridge


# Volúmenes
volumes:
  vertexphp_db_data:
    
